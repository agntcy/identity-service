---
name: Release the UI Image, Bff Image, Python SDK and Charts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  pre-release-test:
    name: Pre Release Test
    uses: ./.github/workflows/reusable-test.yml

  prepare-release:
    name: Prepare Release
    needs: [pre-release-test]
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      targets: ${{ steps.all-targets.outputs.targets }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@09d2acae674a48949e3602304ab46fd20ae0c42f # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set version
        id: set-version
        run: echo "version=$(echo "$GITHUB_REF" | cut -d / -f 3 | cut -c2-)" >> "$GITHUB_OUTPUT"

      - name: List all targets
        id: all-targets
        uses: docker/bake-action/subaction/list-targets@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          workdir: ./deployments/docker
          target: default
        continue-on-error: true

  build-and-push-all-images:
    name: Build and Push Docker Images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-release.outputs.targets) }}
    with:
      bake-targets: ${{ matrix.target }}
      image-tag: ${{ needs.prepare-release.outputs.version }}
      image-repo: ghcr.io/${{ github.repository }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-helm-charts:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-helm.yml
    needs: [prepare-release]
    with:
      charts-dir: "charts"
      gh-pages-branch: "gh-pages"
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-python-sdk:
    name: Build Python SDK
    needs: [prepare-release]
    uses: ./.github/workflows/reusable-python.yml

  sign-python-sdk-release:
    name: Sign Python SDK release assets
    needs: [prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build Python distributions
        working-directory: sdk/python
        run: |
          python -m pip install --require-hashes -r build-requirements.txt
          python -m build --wheel --sdist
          python -m twine check dist/*

      - name: Attest Python distributions
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sdk/python/dist/*

      - name: Verify and prepare release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for artifact in sdk/python/dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE_PATH"
          done
          cp "$BUNDLE_PATH" "sdk/python/dist/identity-service_${GITHUB_REF_NAME}.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > "sdk/python/dist/identity-service_${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" sdk/python/dist/* --clobber

  publish-python-sdk:
    name: Upload Identity Python Package to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-python-sdk
    if: |
      always() &&
      (needs.build-python-sdk.result == 'skipped' || needs.build-python-sdk.result == 'success')
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-linux-x86_64
          merge-multiple: true
          path: ./dist

      - name: Show files
        run: ls -l ./dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: ./dist
